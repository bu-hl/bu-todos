version: "3.8"

services:
 mysql:
   image: mysql:8.0
   container_name: todo-mysql
   restart: unless-stopped
   environment:
     MYSQL_ROOT_PASSWORD: admin
     MYSQL_DATABASE: todo_db
     MYSQL_USER: admin
     MYSQL_PASSWORD: admin
   ports:
     - "3306:3306"
   volumes:
     - mysql_data:/var/lib/mysql
   healthcheck:
     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
     interval: 10s
     timeout: 5s
     retries: 5
   networks:
     - todo-network
 phpmyadmin:
   image: phpmyadmin:latest
   container_name: todo-phpmyadmin
   restart: unless-stopped
   ports:
     - "8080:80"
   environment:
     PMA_HOST: mysql
     PMA_PORT: 3306
     PMA_USER: admin
     PMA_PASSWORD: admin
   depends_on:
     mysql:
       condition: service_healthy
   networks:
     - todo-network

volumes:
 mysql_data:

networks:
 todo-network:
   name: todo-network
   driver: bridge
